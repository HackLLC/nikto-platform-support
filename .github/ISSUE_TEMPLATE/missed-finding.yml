name: Missed finding
description: The scanner should have found something and didn't.
labels: [false-negative]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Filled in automatically when you use "Report an issue" in the console. Otherwise, copy it from Settings > License > Platform version.
      placeholder: "API v0.1.0-beta.1 (abc123) · UI v0.1.0-beta.1 (abc123)"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have been found?
      description: The issue, where it is, and how you know it's there (another tool, manual test, CVE).
    validations:
      required: true
  - type: textarea
    id: scan
    attributes:
      label: How was the scan run?
      description: Which tools (Nikto, Crawl, LFIC, Bustah) and any non-default options.
  - type: textarea
    id: evidence
    attributes:
      label: Request and response
      description: Optional. A request that shows the issue. Redact anything sensitive.
      render: http
