name: Missed finding
description: The scanner should have found something and didn't.
labels: [false-negative]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Do not paste target hostnames, URLs, IP
        addresses, credentials, session tokens or customer data. Describe the
        shape of the problem instead, and replace identifiers with
        `example.com` / `10.0.0.1`.

        Found a vulnerability in Nikto Platform itself? Do not file it here —
        [report it privately](https://github.com/hackllc/nikto-platform-support/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: Filled in automatically when you use "Report an issue" in the console. Otherwise, copy it from Settings > License > Platform version.
      placeholder: "API v0.1.0-beta.1 (abc123) · UI v0.1.0-beta.1 (abc123)"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have been found?
      description: The issue, where it is, and how you know it's there (another tool, manual test, CVE). Describe the path and software, not the host.
    validations:
      required: true
  - type: input
    id: target-software
    attributes:
      label: Target software
      description: What the target runs, not who it is — the Server header, framework, or CMS and version.
      placeholder: "Apache 2.4.57, PHP 8.2"
  - type: textarea
    id: scan
    attributes:
      label: How was the scan run?
      description: Which tools (Nikto, Crawl, LFIC) and any non-default options.
  - type: textarea
    id: evidence
    attributes:
      label: Request and response
      description: Optional. A request that shows the issue. Replace the host with `example.com` and drop cookies and auth headers.
      render: http
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you submit
      options:
        - label: I removed target hostnames, IPs, credentials and customer data from everything above.
          required: true

