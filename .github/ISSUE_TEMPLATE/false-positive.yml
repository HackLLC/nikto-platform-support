name: False positive
description: A finding was reported that isn't real.
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Do not paste target hostnames, URLs, IP
        addresses, credentials, session tokens or customer data. Describe the
        shape of the problem instead, and replace identifiers with
        `example.com` / `10.0.0.1`.

        Found a vulnerability in Nikto Platform itself? Do not file it here —
        [report it privately](https://github.com/hackllc/nikto-platform-support/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: Filled in automatically when you use "Report an issue" in the console. Otherwise, copy it from Settings > License > Platform version.
      placeholder: "API v0.1.0-beta.1 (abc123) · UI v0.1.0-beta.1 (abc123)"
    validations:
      required: true
  - type: input
    id: finding
    attributes:
      label: Finding title
      description: As shown in the Findings list.
    validations:
      required: true
  - type: input
    id: target-software
    attributes:
      label: Target software
      description: What the target runs, not who it is — the Server header, framework, or CMS and version.
      placeholder: "nginx 1.24, WordPress 6.6"
  - type: textarea
    id: why-wrong
    attributes:
      label: Why is it wrong?
      description: What the target actually does, and how you checked.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Request and response
      description: Optional but very helpful. From the finding's evidence panes. Replace the host with `example.com` and drop cookies and auth headers.
      render: http
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you submit
      options:
        - label: I removed target hostnames, IPs, credentials and customer data from everything above.
          required: true

