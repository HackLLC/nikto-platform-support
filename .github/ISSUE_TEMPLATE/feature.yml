name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Do not paste target hostnames, URLs, IP
        addresses, credentials, session tokens or customer data. Describe the
        shape of the problem instead, and replace identifiers with
        `example.com` / `10.0.0.1`.

        Found a vulnerability in Nikto Platform itself? Do not file it here —
        [report it privately](https://github.com/hackllc/nikto-platform-support/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: Optional. Filled in automatically when you use "Report an issue" in the console.
      placeholder: "API v0.1.0-beta.1 (abc123) · UI v0.1.0-beta.1 (abc123)"
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or task, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
