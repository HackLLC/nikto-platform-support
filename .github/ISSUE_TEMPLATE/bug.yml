name: Bug
description: Something in the console or a scan doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Do not paste target hostnames, URLs, IP
        addresses, credentials, session tokens or customer data. Describe the
        shape of the problem instead, and replace identifiers with
        `example.com` / `10.0.0.1`.

        Found a vulnerability in Nikto Platform itself? Do not file it here —
        [report it privately](https://github.com/hackllc/nikto-platform-support/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: Filled in automatically when you use "Report an issue" in the console. Otherwise, copy it from Settings > License > Platform version.
      placeholder: "API v0.1.0-beta.1 (abc123) · UI v0.1.0-beta.1 (abc123)"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Host system
      description: Operating system and architecture of the machine running the platform.
      placeholder: "macOS 15 (Apple silicon)"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remove hostnames, credentials or anything else you can't share. `nikto-launcher support-bundle` collects diagnostics with secrets redacted — review it before attaching.
      render: shell
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you submit
      options:
        - label: I removed target hostnames, IPs, credentials and customer data from everything above.
          required: true

